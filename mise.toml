# Pinned tools for the catalog. See
# https://github.com/simpsonm09-org/simpsonm09-repo-standard/blob/main/docs/task-runner.md

[tools]
"aqua:biomejs/biome" = "2.5.14"

# Task runner
"aqua:casey/just" = "1.58.0"

# Workflow linters
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# Linters
"aqua:grafana/flint" = "0.22.14"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Validate the roster against the organization"
run = "node scripts/validate.mjs"
