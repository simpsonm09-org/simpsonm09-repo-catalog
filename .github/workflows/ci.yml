name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@334d3660fb8fb7cec5e24b61be68b7535774313d # repo-standard, pinned commit
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@334d3660fb8fb7cec5e24b61be68b7535774313d # repo-standard, pinned commit
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@334d3660fb8fb7cec5e24b61be68b7535774313d # repo-standard, pinned commit
  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@334d3660fb8fb7cec5e24b61be68b7535774313d # repo-standard, pinned commit
  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the roster
        run: node scripts/validate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
